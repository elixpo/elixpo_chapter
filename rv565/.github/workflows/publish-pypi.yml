name: Publish to PyPI

# Uses PyPI trusted publishing: no token is stored. Configure the publisher on
# pypi.org for elixpo/rv565, workflow publish-pypi.yml, environment pypi.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check versions agree
        run: python3 -I tools/check_version.py
      - name: Build
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet build
          /tmp/venv/bin/python -m build python --outdir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC for trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
