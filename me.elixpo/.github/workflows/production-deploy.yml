name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy static site
    uses: elixpo/agent.elixpo/.github/workflows/deploy-cloudflare-pages.yml@main
    with:
      project-name: elixpome
      node-version: "20"
      # Sitemap lastmod comes from git history; the shared checkout is shallow, so fetch the
      # rest (public repository, no credentials needed). The media optimizer needs FFmpeg.
      pre-build-command: |
        git fetch --quiet --unshallow --no-tags origin
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends ffmpeg
        ffmpeg -version
      build-env: |
        NEXT_TELEMETRY_DISABLED=1
      build-command: ./deploy.sh build
      output-directory: out
      environment: production
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
