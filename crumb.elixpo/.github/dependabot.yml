version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ['*']
    # Debian builds Crumb against Debian's own Rust crates, which ship
    # base64 0.22, sha2 0.10, rusqlite 0.40 and reedline 0.52; these breaking
    # 0.x releases would break that build and the code that uses them.
    ignore:
      - dependency-name: base64
        versions: ['>= 0.23']
      - dependency-name: sha2
        versions: ['>= 0.11']
      - dependency-name: rusqlite
        versions: ['>= 0.41']
      - dependency-name: reedline
        versions: ['>= 0.53']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
