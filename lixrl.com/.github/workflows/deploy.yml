name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target for a manual run
        required: true
        type: choice
        default: all
        options: [all, package, vscode, worker, pages, github]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  changes:
    name: Detect deployment targets
    runs-on: ubuntu-latest
    outputs:
      npm_packages: ${{ steps.detect.outputs.npm_packages }}
      vscode_packages: ${{ steps.detect.outputs.vscode_packages }}
      worker: ${{ steps.detect.outputs.worker }}
      pages: ${{ steps.detect.outputs.pages }}
      migrations: ${{ steps.detect.outputs.migrations }}
      npm_matrix: ${{ steps.matrix.outputs.npm_matrix }}
      vscode_matrix: ${{ steps.matrix.outputs.vscode_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - id: detect
        name: Map changed paths
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MANUAL_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            all_npm=""
            all_vscode=""
            for manifest in packages/*/package.json; do
              [ -f "$manifest" ] || continue
              directory="$(basename "$(dirname "$manifest")")"
              if node -e "const p=require('./$manifest'); process.exit(p.engines?.vscode ? 0 : 1)"; then
                all_vscode="$all_vscode $directory"
              else
                all_npm="$all_npm $directory"
              fi
            done
            all_npm="${all_npm# }"
            all_vscode="${all_vscode# }"
            case "$MANUAL_TARGET" in
              all) npm_packages="$all_npm"; vscode_packages="$all_vscode"; worker=true; pages=true; migrations=true ;;
              package) npm_packages="$all_npm"; vscode_packages=""; worker=false; pages=false; migrations=false ;;
              vscode) npm_packages=""; vscode_packages="$all_vscode"; worker=false; pages=false; migrations=false ;;
              github) npm_packages="github-only"; vscode_packages=""; worker=false; pages=false; migrations=false ;;
              worker) npm_packages=""; vscode_packages=""; worker=true; pages=false; migrations=false ;;
              pages) npm_packages=""; vscode_packages=""; worker=false; pages=true; migrations=true ;;
            esac
          else
            # Multi-commit pushes put BEFORE outside the shallow clone; fetch it,
            # and treat every file as changed when it is unavailable (new branch,
            # force push).
            have_before=false
            if [[ ! "$BEFORE" =~ ^0+$ ]]; then
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BEFORE"; then
                have_before=true
              fi
            fi
            if [ "$have_before" = true ]; then
              git diff --name-only "$BEFORE" "$AFTER" > "$RUNNER_TEMP/changed-files"
            else
              git ls-files > "$RUNNER_TEMP/changed-files"
            fi
            npm_packages=""
            vscode_packages=""
            while IFS= read -r directory; do
              [ -n "$directory" ] || continue
              if [ -f "packages/$directory/package.json" ]; then
                if node -e "const p=require('./packages/$directory/package.json'); process.exit(p.engines?.vscode ? 0 : 1)"; then
                  vscode_packages="$vscode_packages $directory"
                else
                  npm_packages="$npm_packages $directory"
                fi
              fi
            done < <(awk -F/ '/^packages\/[^/]+\// {print $2}' "$RUNNER_TEMP/changed-files" | sort -u)
            npm_packages="${npm_packages# }"
            vscode_packages="${vscode_packages# }"
            if grep -Eq '^(workers/subdomain-router\.ts|wrangler\.subdomains\.toml)$' "$RUNNER_TEMP/changed-files"; then worker=true; else worker=false; fi
            if grep -Eq '^(app/|lib/|public/|workers/migrations/|package(-lock)?\.json$|next\.config\.js$|middleware\.ts$|tailwind\.config\.ts$|postcss\.config\.js$|theme\.js$|wrangler\.toml$)' "$RUNNER_TEMP/changed-files"; then pages=true; else pages=false; fi
            if grep -Eq '^workers/migrations/' "$RUNNER_TEMP/changed-files"; then migrations=true; else migrations=false; fi
          fi
          echo "npm_packages=$npm_packages" >> "$GITHUB_OUTPUT"
          echo "vscode_packages=$vscode_packages" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
      - id: matrix
        name: Build package matrices
        env:
          NPM_PACKAGES: ${{ steps.detect.outputs.npm_packages }}
          VSCODE_PACKAGES: ${{ steps.detect.outputs.vscode_packages }}
        run: |
          set -euo pipefail
          # "github-only" (manual github target) mirrors without publishing to npm.
          to_json() { printf '%s\n' $1 | jq -Rnc '[inputs | select(length > 0 and . != "github-only")]'; }
          echo "npm_matrix=$(to_json "$NPM_PACKAGES")" >> "$GITHUB_OUTPUT"
          echo "vscode_matrix=$(to_json "$VSCODE_PACKAGES")" >> "$GITHUB_OUTPUT"

  npm:
    name: Publish npm packages
    needs: changes
    if: needs.changes.outputs.npm_matrix != '[]'
    strategy:
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.npm_matrix) }}
    permissions:
      contents: read
      id-token: write
    uses: elixpo/agent.elixpo/.github/workflows/publish-npm.yml@main
    with:
      working-directory: packages/${{ matrix.package }}
      environment: production
      # Same checks deploy.sh ran before publishing: build and test when present,
      # then install the packed tarball into a scratch project as a smoke test.
      build-command: |
        npm run build --if-present
        npm run test --if-present
        tarball="$(npm pack --pack-destination "$RUNNER_TEMP" --quiet)"
        mkdir -p "$RUNNER_TEMP/smoke"
        cd "$RUNNER_TEMP/smoke"
        npm init -y >/dev/null
        npm install "$RUNNER_TEMP/$tarball" --no-save
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  vscode:
    name: Publish VS Code packages
    needs: changes
    if: needs.changes.outputs.vscode_matrix != '[]'
    strategy:
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.vscode_matrix) }}
    permissions:
      contents: read
    uses: elixpo/agent.elixpo/.github/workflows/publish-vscode.yml@main
    with:
      working-directory: packages/${{ matrix.package }}
      environment: production
      build-command: |
        npm run build --if-present
        npm run test --if-present
    secrets:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

  github:
    name: Mirror packages to GitHub
    needs: [changes, npm]
    if: >-
      always() && needs.changes.outputs.npm_packages != '' &&
      (needs.npm.result == 'success' || needs.npm.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@elixpo'
      - name: Build and mirror packages
        env:
          PACKAGE_NAMES: ${{ needs.changes.outputs.npm_packages }}
        run: |
          set -euo pipefail
          if [ "$PACKAGE_NAMES" = "all" ] || [ "$PACKAGE_NAMES" = "github-only" ]; then
            ./deploy.sh --github build deploy
          else
            for package_name in $PACKAGE_NAMES; do
              ./deploy.sh --github --name "$package_name" build deploy
            done
          fi

  worker:
    name: Deploy Cloudflare Worker
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    permissions:
      contents: read
    uses: elixpo/agent.elixpo/.github/workflows/deploy-cloudflare-worker.yml@main
    with:
      environment: production
      # The shared workflow runs a bare `wrangler deploy`; the router lives in
      # wrangler.subdomains.toml, so promote it to the default config in the
      # throwaway CI checkout (deploy.sh passes --config instead).
      pre-build-command: cp wrangler.subdomains.toml wrangler.toml
      build-command: npx wrangler deploy --dry-run --outdir .wrangler/deploy/subdomains
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  pages:
    name: Deploy Cloudflare Pages
    needs: changes
    if: needs.changes.outputs.pages == 'true'
    permissions:
      contents: read
    uses: elixpo/agent.elixpo/.github/workflows/deploy-cloudflare-pages.yml@main
    with:
      project-name: elixpourl
      build-command: npm run pages:build
      output-directory: .vercel/output/static
      branch: main
      environment: production
      # Migrations run between build and deploy, only when workers/migrations/
      # changed (or on a manual all/pages run), as deploy.sh migrate did.
      d1-database: ${{ needs.changes.outputs.migrations == 'true' && 'elixpourl' || '' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
