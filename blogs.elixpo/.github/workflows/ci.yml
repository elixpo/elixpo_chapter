# The first, repeatable review of every contribution. This job deliberately
# needs no secrets, so it is safe to run against pull requests from forks.
name: PR review

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: PR quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          # Keep the review runtime aligned with the production Pages job.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Use the production adapter here, not plain `next build`: Cloudflare
      # rejects dynamic routes that omit the Edge Runtime even when Next's
      # build succeeds. Keeping both workflows on the same command prevents a
      # green PR from blocking the production deployment after merge.
      - name: Build for Cloudflare Pages
        run: npm run pages:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Summarize the review
        if: always()
        run: |
          {
            echo "## PR quality gate"
            echo
            echo 'This check installs from the lockfile, runs `npm test`, and builds with the Cloudflare Pages adapter on Node 22.'
            echo
            echo "Run the same commands locally:"
            echo '```bash'
            echo "npm ci"
            echo "npm test"
            echo "npm run pages:build"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  preview:
    name: Deploy trusted preview
    needs: quality
    # Fork pull requests receive the secretless quality gate only. Never run
    # contributor-controlled code from a fork with deployment credentials.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}.lixblogs.pages.dev
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        run: npm run pages:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_URL: https://pr-${{ github.event.pull_request.number }}.lixblogs.pages.dev
          NEXT_PUBLIC_ELIXPO_CLIENT_ID: ${{ vars.NEXT_PUBLIC_ELIXPO_CLIENT_ID }}

      # A preview publishes only the Pages output. In particular, it does not
      # apply D1 migrations, deploy Workers, or publish packages.
      - name: Deploy preview to Cloudflare Pages
        run: >-
          npx wrangler pages deploy .vercel/output/static
          --project-name lixblogs
          --branch "pr-${{ github.event.pull_request.number }}"
          --commit-hash "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summarize the preview
        run: |
          {
            echo "## Reviewer preview"
            echo
            echo "Review this commit at https://pr-${{ github.event.pull_request.number }}.lixblogs.pages.dev"
            echo
            echo 'This is a preview deployment. Production is deployed only after a merge to `main`.'
          } >> "$GITHUB_STEP_SUMMARY"
