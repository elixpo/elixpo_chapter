# Opt-in workflow to generate a technical LixBlogs draft from a merged pull request.
#
# Triggers:
#   - pull_request: closed + merged + labeled with 'blog-draft'
#   - workflow_dispatch: manual run specifying the PR number
#
# Requires:
#   - LIXBLOGS_PAT secret with 'lixblogs:blog:read' and 'lixblogs:blog:write' scopes.
#   - Fork pull requests gracefully skip execution because repository secrets are withheld.

name: PR Blog Draft

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to generate draft from"
        required: true
        type: number
      publication:
        description: "Target publication (personal or org:ID)"
        required: false
        default: "personal"
        type: string
      collection:
        description: "Target collection ID (optional)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Validate without writing draft to LixBlogs"
        required: false
        default: false
        type: boolean

concurrency:
  group: pr-blog-draft-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  draft:
    name: Generate Technical Draft
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'blog-draft'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: 22

      - name: Generate LixBlogs draft
        id: generate-draft
        env:
          LIXBLOGS_TOKEN: ${{ secrets.LIXBLOGS_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
          PUBLICATION: ${{ inputs.publication || 'personal' }}
          COLLECTION: ${{ inputs.collection || '' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: python .github/scripts/pr_blog_draft.py
