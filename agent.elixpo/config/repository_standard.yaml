schema_version: 1
owner: elixpo
repository_manifest: config/elixpoo_rollout.yaml

# These settings are common to every active repository in the rollout manifest.
# Repository-specific CI checks are declared below and are never inferred away.
defaults:
  settings:
    default_branch: main
    has_issues: true
    has_projects: true
    has_wiki: false
    allow_squash_merge: true
    allow_merge_commit: false
    allow_rebase_merge: false
    allow_auto_merge: true
    delete_branch_on_merge: true
    allow_update_branch: true
    web_commit_signoff_required: false
  ruleset:
    names: [Elixpo main standard]
    enforcement: active
    target: branch
    include: [refs/heads/main]
    required_rules: [deletion, non_fast_forward, pull_request]
    allowed_merge_methods: [squash]
    required_approving_review_count: 0
    dismiss_stale_reviews_on_push: true
    required_review_thread_resolution: true
    require_code_owner_review: false
    require_last_push_approval: false
    require_extra_approval_for_unattributed_changes: false
    strict_required_status_checks_policy: true
    required_status_checks: []

overrides:
  .github:
    ruleset:
      names: [Protect organization profile]
      require_extra_approval_for_unattributed_changes: true
      required_status_checks: [Verify canonical organization README]
  admin.elixpo:
    ruleset:
      required_status_checks: [Lint and typecheck, Cloudflare-compatible build]
  blogs.elixpo:
    ruleset:
      required_status_checks: [Unit tests, Cloudflare build]
  elixpo_chapter:
    ruleset:
      required_status_checks: [Verify canonical Chapter README]
  mails.elixpo:
    ruleset:
      required_status_checks: [Lint and typecheck, Cloudflare-compatible build]
  payouts.elixpo:
    ruleset:
      required_status_checks: [Lint and typecheck, Cloudflare-compatible build]
  sketch.elixpo:
    ruleset:
      required_status_checks: [PR quality gate]
  status.elixpo:
    ruleset:
      required_status_checks: [Lint and typecheck, Cloudflare-compatible build]
