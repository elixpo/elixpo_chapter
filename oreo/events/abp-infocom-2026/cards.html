<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Falera QR cards · ABP Infocom 2026</title>
<!--
  Handout cards, 85 x 55 mm, ten to an A4 sheet (two columns, five rows) with
  crop marks. Edit the card once in <template id="card">; make_poster.py
  prints out/qr-cards-a4.pdf. The QR is the poster's (assets/qr-github.svg).
-->
<style>
  :root {
    --ink: #142018; --dim: #4a514d; --muted: #5f6962; --red: #c93a45; --border: #d7dbd6; --paper: #fbfbf8;
    --serif: Georgia, "Noto Serif", serif;
    --sans: Arial, "Liberation Sans", "Noto Sans", sans-serif;
    --mono: "Liberation Mono", "DejaVu Sans Mono", monospace;
  }
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 210mm; height: 297mm; position: relative; background: #fff;
         font-family: var(--sans); color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  /* 2 x 85 + 6 mm gap = 176 mm wide; 5 x 55 + 4 x 3 mm = 287 mm tall. */
  .sheet { position: absolute; left: 17mm; top: 5mm; display: grid;
           grid-template-columns: repeat(2, 85mm); grid-auto-rows: 55mm; column-gap: 6mm; row-gap: 3mm; }
  .card { position: relative; width: 85mm; height: 55mm; background: var(--paper); overflow: hidden; }
  .card .band { position: absolute; left: 0; top: 0; bottom: 0; width: 2.4mm; background: var(--red); }
  .card .qr { position: absolute; right: 4.5mm; top: 50%; transform: translateY(-50%); width: 30mm; height: 30mm; }
  .card .txt { position: absolute; left: 7mm; top: 5.5mm; width: 44mm; }
  .card .t1 { font: 700 9mm/1 var(--serif); color: var(--red); letter-spacing: -0.2mm; }
  .card .t2 { margin-top: 1.6mm; font: 700 3.1mm/1.25 var(--serif); color: var(--ink); }
  .card .t3 { margin-top: 1.6mm; font: italic 2.6mm/1.3 var(--serif); color: var(--dim); }
  .card .who { position: absolute; left: 7mm; bottom: 5mm; width: 44mm; }
  .card .who b { display: block; font: 700 3.1mm/1.2 var(--sans); color: var(--ink); }
  .card .who span { display: block; margin-top: 0.6mm; font: 400 2.5mm/1.2 var(--sans); color: var(--muted); }
  .card .who i { display: block; margin-top: 1mm; font: 700 2.4mm/1 var(--mono); font-style: normal; color: var(--red); }
  .card .scan { position: absolute; right: 3mm; bottom: 3mm; width: 33mm; text-align: center; white-space: nowrap;
                font: 700 1.9mm/1 var(--mono); color: var(--muted); }
  /* Crop marks: hairlines in the gaps, outside every card. */
  .crop { position: absolute; background: #000; }
</style>
</head>
<body>
<template id="card">
  <div class="card">
    <div class="band"></div>
    <div class="txt">
      <div class="t1">Falera</div>
      <div class="t2">An open-source smart badge with its own operating system</div>
      <div class="t3">I designed the board and wrote its operating system.</div>
    </div>
    <div class="who"><b>Ayushman Bhattacharya</b><span>Founder, Elixpo · JIS University</span><i>falera.elixpo.com</i></div>
    <img class="qr" src="assets/qr-github.svg" alt="QR code: github.com/elixpo/falera">
    <div class="scan">github.com/elixpo/falera</div>
  </div>
</template>
<div class="sheet" id="sheet"></div>
<script>
  const sheet = document.getElementById("sheet"), tpl = document.getElementById("card");
  for (let i = 0; i < 10; i++) sheet.appendChild(tpl.content.cloneNode(true));
  // Crop marks at each card corner, 2 mm long, 0.5 mm off the corner.
  const X0 = 17, Y0 = 5, W = 85, H = 55, GX = 6, GY = 3, L = 2, OFF = 0.5;
  const mm = (v) => v + "mm";
  function mark(x, y, w, h) {
    const s = document.createElement("span"); s.className = "crop";
    Object.assign(s.style, { left: mm(x), top: mm(y), width: mm(w), height: mm(h) });
    document.body.appendChild(s);
  }
  for (let r = 0; r < 5; r++) for (let c = 0; c < 2; c++) {
    const x = X0 + c * (W + GX), y = Y0 + r * (H + GY);
    for (const [cx, sx] of [[x, -1], [x + W, 1]]) for (const [cy, sy] of [[y, -1], [y + H, 1]]) {
      mark(sx < 0 ? cx - OFF - L : cx + OFF, cy - 0.05, L, 0.1);   // horizontal
      mark(cx - 0.05, sy < 0 ? cy - OFF - L : cy + OFF, 0.1, L);   // vertical
    }
  }
</script>
</body>
</html>
