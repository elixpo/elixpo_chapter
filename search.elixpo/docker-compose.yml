services:
  # ── Redis — cache & session storage ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lixsearch-redis
    init: true
    mem_limit: 1g
    command: >
      redis-server --port 9530 --dir /data
      --appendonly yes
      --maxmemory 768mb --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-changeme_redis_secret}
    environment:
      - REDIS_REPL_DISKLESS_SYNC=yes
    volumes:
      - ./data/redis:/data
    networks:
      - elixpo-network
    expose:
      - "9530"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "9530", "-a", "${REDIS_PASSWORD:-changeme_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Qdrant — production vector store
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: lixsearch-qdrant
    init: true
    mem_limit: 2g
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - elixpo-network
    expose:
      - "6333"
      - "6334"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Optional temporal graph memory ───────────────────────────────────
  # Start with: docker compose --profile graph-memory up -d
  falkordb:
    profiles: ["graph-memory"]
    image: falkordb/falkordb-server:v4.20.4-alpine
    container_name: oreolook-falkordb
    init: true
    mem_limit: 1g
    environment:
      - REDIS_ARGS=--appendonly yes --dir /var/lib/falkordb/data --requirepass ${FALKORDB_PASSWORD:-changeme_graph_secret}
      - FALKORDB_ARGS=THREAD_COUNT 2 CACHE_SIZE 50 TIMEOUT_MAX 60000
    volumes:
      - ./data/falkordb:/var/lib/falkordb/data
    networks:
      - elixpo-network
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${FALKORDB_PASSWORD:-changeme_graph_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  graph-memory-worker:
    profiles: ["graph-memory"]
    build:
      context: .
      dockerfile: Dockerfile.graph-memory
    container_name: oreolook-graph-memory
    init: true
    mem_limit: 512m
    env_file:
      - .env.local
    environment:
      - GRAPH_MEMORY_ENABLED=true
      - GRAPH_MEMORY_BACKEND=graphiti
      - GRAPH_MEMORY_REDIS_DB=${GRAPH_MEMORY_REDIS_DB:-5}
      - DOCTOR_APPROVAL_SECRET=${DOCTOR_APPROVAL_SECRET}
      - DOCTOR_ALLOW_GLOBAL=${DOCTOR_ALLOW_GLOBAL:-false}
      - REDIS_HOST=redis
      - REDIS_PORT=9530
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme_redis_secret}
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-changeme_graph_secret}
      - FALKORDB_DATABASE=${FALKORDB_DATABASE:-oreolook_memory}
    networks:
      - elixpo-network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── IPC Service — embeddings + Playwright search agents ──────────────
  ipc-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: lixsearch-ipc
    init: true
    env_file:
      - .env.local
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - APP_MODE=ipc
      - DOCTOR_APPROVAL_SECRET=
      - MODEL_CACHE_DIR=/app/data/models
      - HF_HOME=/app/data/models
      - SENTENCE_TRANSFORMERS_HOME=/app/data/models
      - LOG_LEVEL=INFO
      - REDIS_HOST=redis
      - REDIS_PORT=9530
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme_redis_secret}
      - QDRANT_MODE=server
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - IPC_HOST=0.0.0.0
      - IPC_PORT=9510
      - IPC_AUTHKEY=${IPC_AUTHKEY:-changeme_ipc_secret}
      - SEARCH_AGENT_POOL_SIZE=${SEARCH_AGENT_POOL_SIZE:-2}
      - SEARCH_AGENT_MAX_TABS=${SEARCH_AGENT_MAX_TABS:-15}
    volumes:
      - ${MODEL_CACHE_HOST_DIR:-./data/models}:/app/data/models
      - ./data/embeddings:/app/data/embeddings
      - ./data/logs:/app/logs
    networks:
      - elixpo-network
    expose:
      - "9510"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.settimeout(5); s.connect((\"localhost\", 9510)); s.close()'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    # Cap RAM so a future leak fails loudly (OOMKilled=true) instead of
    # silently churning the process. One CoreEmbeddingService + Playwright
    # pool of 2 fits comfortably in <2 GiB; 6 GiB is generous headroom.
    mem_limit: 4g
    memswap_limit: 4g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx — external entry point ─────────────────────────────────────
  nginx:
    image: nginx:stable-alpine
    container_name: lixsearch-nginx
    init: true
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
      - "10001:10001"
    environment:
      - API_KEY=${API_KEY:-changeme_api_key}
    command: >
      /bin/sh -c "envsubst '$${API_KEY}' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./deploy/tls/origin.pem:/etc/nginx/tls/origin.pem:ro
      - ./deploy/tls/origin-key.pem:/etc/nginx/tls/origin-key.pem:ro
      - ./search.elixpo/out:/usr/share/nginx/html:ro
      - ./data/nginx-cache:/var/cache/nginx
    networks:
      - elixpo-network
    restart: unless-stopped
    depends_on:
      ipc-service:
        condition: service_healthy
      lixsearch-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /usr/share/nginx/html/index.html && wget -q --spider http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── App Workers — scalable Quart/Hypercorn instances ─────────────────
  lixsearch-app:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    env_file:
      - .env.local
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - APP_MODE=worker
      - DOCTOR_APPROVAL_SECRET=
      - CORE_SERVICE_BACKEND=ipc
      - LOG_LEVEL=INFO
      - REDIS_HOST=redis
      - REDIS_PORT=9530
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme_redis_secret}
      - QDRANT_MODE=server
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - WORKER_TIMEOUT=120
      - WORKER_PORT=9002
      - WORKERS=1
      - IPC_HOST=ipc-service
      - IPC_PORT=9510
      - IPC_AUTHKEY=${IPC_AUTHKEY:-changeme_ipc_secret}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://search.elixpo.com}
      - POLLINATIONS_TOKEN_VALIDATION_URL=${POLLINATIONS_TOKEN_VALIDATION_URL:-https://enter.pollinations.ai/api/account/key}
      - POLLINATIONS_TOKEN_VALIDATION_TIMEOUT_SECONDS=${POLLINATIONS_TOKEN_VALIDATION_TIMEOUT_SECONDS:-3}
      - IMAGE_STORE_DIR=/app/data/cache/images
      - CONTENT_STORE_DIR=/app/data/cache/content
    volumes:
      - ./data/embeddings:/app/data/embeddings
      - ./data/cache:/app/data/cache
      - ./data/conversations:/app/data/conversations
      - ./data/logs:/app/logs
      - ./data/tmp-cache:/app/tmp/cache
    networks:
      - elixpo-network
    expose:
      - "9002"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ipc-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/api/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    mem_limit: 1536m
    memswap_limit: 1536m
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Monitor — lightweight production monitoring ──────────────────────
  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lixsearch-monitor
    init: true
    mem_limit: 256m
    env_file:
      - .env.local
    environment:
      - PYTHONUNBUFFERED=1
      - APP_MODE=monitor
      - DOCTOR_APPROVAL_SECRET=
      - MONITOR_PORT=9520
      - IPC_HOST=ipc-service
      - IPC_PORT=9510
      - IPC_AUTHKEY=${IPC_AUTHKEY:-changeme_ipc_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=9530
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme_redis_secret}
      - QDRANT_MODE=server
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - elixpo-network
    expose:
      - "9520"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      ipc-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9520/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

networks:
  elixpo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
