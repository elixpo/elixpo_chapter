user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  map_hash_bucket_size 128;

  resolver 127.0.0.11 valid=10s;
  resolver_timeout 5s;

  log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  log_format detailed '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent '
                      '"$http_x_request_id" '
                      '$request_time $upstream_response_time '
                      '"$http_user_agent"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 100M;

  client_body_buffer_size 128k;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 16k;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript 
             application/json application/javascript application/xml+rss 
             application/rss+xml font/truetype font/opentype 
             application/vnd.ms-fontobject image/svg+xml;

  limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
  limit_req_zone $binary_remote_addr zone=search:10m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=chat:10m rate=30r/s;

  upstream lixsearch_backend {
    least_conn;
    server lixsearch-app:9002 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=lixsearch_cache:100m 
                   max_size=1g inactive=60m use_temp_path=off;

  map $upstream_cache_status $cache_status {
    MISS "MISS";
    HIT "HIT";
    STALE "STALE";
    BYPASS "BYPASS";
    default $upstream_cache_status;
  }

  # Extract Bearer token from Authorization header
  map $http_authorization $auth_bearer_token {
    default "";
    "~^Bearer\s+(.+)$" $1;
  }

  # Resolve provided API key: X-API-Key header > Authorization: Bearer > ?key= param
  map $http_x_api_key $provided_api_key {
    default $http_x_api_key;
    ""      $auth_bearer_or_param;
  }
  map $auth_bearer_token $auth_bearer_or_param {
    default $auth_bearer_token;
    ""      $arg_key;
  }

  # Compute auth result: "ok" if key matches, "missing" if empty, "invalid" otherwise
  map $provided_api_key $api_auth_result {
    default       "invalid";
    ""            "missing";
    "${API_KEY}"  "ok";
  }

  # Pollinations endpoint-agent credentials are short-lived delegated Bearer
  # tokens. Send any ag_ candidate on OpenAI routes to application auth, which
  # accepts only a sole Authorization Bearer and rejects every other placement.
  map "$auth_bearer_token:$http_x_api_key:$arg_key" $has_agent_token {
    default                                  0;
    "~(^|:)ag_[A-Za-z0-9._-]+(:|$)"         1;
  }
  map "$api_auth_result:$has_agent_token" $openai_auth_result {
    default                                  $api_auth_result;
    "~^(missing|invalid|ok):1$"              "agent";
  }

  # Per-URI Content Security Policy: relaxed for /docs, strict everywhere else
  map $uri $csp_header {
    ~^/docs           "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net blob:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: https:; connect-src 'self'; worker-src 'self' blob:";
    ~^/api/docs       "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net blob:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: https:; connect-src 'self'; worker-src 'self' blob:";
    ~^/openapi\.      "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: https:; connect-src 'self'";
    default           "default-src 'self'";
  }

  server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp_header always;

    # Hide server version
    server_tokens off;

    # Scalar API docs — proxy to backend (no caching)
    location ~ ^/(api/docs|openapi\.(json|yaml))$ {
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
    }

    location = /api/health {
      access_log off;
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    # OreoLook MCP — app-level bearer auth; supports long Streamable HTTP calls.
    location /mcp {
      limit_req zone=search burst=10 nodelay;
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_connect_timeout 10s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_intercept_errors off;
    }

    # Monitor endpoints (no auth — internal use)
    location /api/monitor {
      proxy_pass http://lixsearch-monitor:9520;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    location /api/search {
      limit_req zone=search burst=10 nodelay;
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header X-Session-ID $http_x_session_id;
      proxy_connect_timeout 10s;
      proxy_send_timeout 120s;
      proxy_read_timeout 300s;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_intercept_errors off;
    }

    # OpenAI-compatible /v1/* endpoints
    location /v1/ {
      if ($api_auth_result = "missing") { return 401 '{"error":"API key required"}'; }
      if ($api_auth_result = "invalid") { return 403 '{"error":"Invalid API key"}'; }
      limit_req zone=search burst=10 nodelay;
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_connect_timeout 10s;
      proxy_send_timeout 120s;
      proxy_read_timeout 300s;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_intercept_errors off;
    }

    location ~ ^/api/(session/)?chat {
      limit_req zone=chat burst=5 nodelay;
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header X-Session-ID $http_x_session_id;
      proxy_connect_timeout 10s;
      proxy_send_timeout 120s;
      proxy_read_timeout 300s;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_intercept_errors off;
    }

    location ~ ^/api/session {
      limit_req zone=general burst=20 nodelay;
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header X-Session-ID $http_x_session_id;
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 60s;
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;
      proxy_cache off;
      proxy_intercept_errors off;
    }

    location /api/stats {
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 30s;
      proxy_cache lixsearch_cache;
      proxy_cache_valid 200 10s;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      add_header X-Cache-Status $cache_status;
    }

    # Catch-all for any /api/ or /v1/ route not matched above
    location ~ ^/(api|v1)/ {
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_connect_timeout 10s;
      proxy_send_timeout 60s;
      proxy_read_timeout 120s;
      proxy_buffering off;
      proxy_cache off;
    }

    # Block access to hidden files (.git, .env, .htaccess, etc.)
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
      return 404;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri.html $uri/index.html =404;
      error_page 404 /404.html;
      add_header Cache-Control "public, max-age=3600";
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
      default_type text/html;
      return 503 '{"error": "Service unavailable", "status": 503}';
    }

    error_page 504 /504.html;
    location = /504.html {
      default_type text/html;
      return 504 '{"error": "Gateway timeout", "status": 504}';
    }
  }

  # ── Production server on port 10001 (API key required) ──
  # Auth accepts: X-API-Key header, Authorization: Bearer <key>, or ?key= query param
  server {
    listen 10001;
    listen 80;
    server_name search.elixpo.com localhost;
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    default_type application/json;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp_header always;
    server_tokens off;

    # Health endpoint (no auth — for monitoring/Cloudflare health checks)
    location = /api/health {
      access_log off;
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    # OreoLook MCP — protocol auth is enforced by the ASGI application.
    location /mcp {
      limit_req zone=search burst=10 nodelay;
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_connect_timeout 10s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_intercept_errors off;
    }

    # Docs (no auth — public documentation, no caching)
    location ~ ^/(api/docs|openapi\.(json|yaml))$ {
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
    }

    # Models list (no auth — needed for client discovery)
    location /v1/models {
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }
    location /api/models {
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    # Image serving (no auth — referenced in responses by URL)
    # ^~ prevents the catch-all regex below from intercepting with auth.
    location ^~ /api/image/ {
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 10s;
    }

    # Content serving (no auth — PDFs/docs referenced in responses by URL)
    # ^~ prevents the catch-all regex below from intercepting with auth.
    location ^~ /api/content/ {
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    # Search (auth required)
    location /api/search {
      if ($api_auth_result = "missing") { return 401 '{"error":"API key required. Pass via Authorization: Bearer <key>, X-API-Key header, or ?key= param"}'; }
      if ($api_auth_result = "invalid") { return 403 '{"error":"Invalid API key"}'; }
      limit_req zone=search burst=10 nodelay;
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header X-Session-ID $http_x_session_id;
      proxy_connect_timeout 10s;
      proxy_send_timeout 120s;
      proxy_read_timeout 300s;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_intercept_errors off;
    }

    # OpenAI-compatible endpoints. A delegated ag_ token may enter only here;
    # the application performs remote validation and returns OpenAI errors.
    location ~ ^/v1/(chat/completions|responses)$ {
      if ($openai_auth_result = "missing") { return 401 '{"error":{"message":"API key required","type":"authentication_error"}}'; }
      if ($openai_auth_result = "invalid") { return 403 '{"error":{"message":"Invalid API key","type":"authentication_error"}}'; }
      limit_req zone=search burst=10 nodelay;
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_connect_timeout 10s;
      proxy_send_timeout 120s;
      proxy_read_timeout 300s;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_intercept_errors off;
    }

    # Session endpoints (auth required — create, get, delete)
    location /api/session {
      if ($api_auth_result = "missing") { return 401 '{"error":"API key required. Pass via ?key= param"}'; }
      if ($api_auth_result = "invalid") { return 403 '{"error":"Invalid API key"}'; }
      limit_req zone=general burst=20 nodelay;
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 60s;
      proxy_cache off;
      proxy_intercept_errors off;
    }

    # Stats (cached, no auth — public)
    location /api/stats {
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 30s;
      proxy_cache lixsearch_cache;
      proxy_cache_valid 200 10s;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      add_header X-Cache-Status $cache_status;
    }

    # Surf (auth required)
    location /api/surf {
      if ($api_auth_result = "missing") { return 401 '{"error":"API key required"}'; }
      if ($api_auth_result = "invalid") { return 403 '{"error":"Invalid API key"}'; }
      limit_req zone=search burst=10 nodelay;
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_connect_timeout 10s;
      proxy_send_timeout 60s;
      proxy_read_timeout 120s;
      proxy_buffering off;
      proxy_cache off;
      proxy_intercept_errors off;
    }

    # Catch-all for any /api/ or /v1/ route not matched above (auth required)
    location ~ ^/(api|v1)/ {
      if ($api_auth_result = "missing") { return 401 '{"error":"API key required"}'; }
      if ($api_auth_result = "invalid") { return 403 '{"error":"Invalid API key"}'; }
      proxy_pass http://lixsearch_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_connect_timeout 10s;
      proxy_send_timeout 60s;
      proxy_read_timeout 120s;
      proxy_buffering off;
      proxy_cache off;
    }

    # Block access to hidden files (.git, .env, .htaccess, etc.)
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
      return 404;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri.html $uri/index.html =404;
      error_page 404 /404.html;
      add_header Cache-Control "public, max-age=3600";
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
      default_type text/html;
      return 503 '{"error": "Service unavailable", "status": 503}';
    }
  }
}
